<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giới thiệu</title>
    <link rel="stylesheet" href="cuoikicss.css" />
  </head>
  <body>
    <main>
      <section class="gioithieu">
        <h1>GIỚI THIỆU NGƯỜI THỰC HIỆN</h1>
        <div class="thongtin">
          <img src="anhthe.jpg" alt="Ảnh người thực hiện" />
          <h2>Họ và tên: Nguyễn Thị Ngọc Trâm</h2>
          <p><strong>Mã sinh viên:</strong>25003342</p>
          <p><strong>Sở thích:</strong> Ngủ, nghe nhạc, xem phim</p>
          <p><strong>Vai trò:</strong> Người thực hiện đề tài</p>
        </div>
      </section>
      <section class="form-section">
        <h1>ĐĂNG KÝ THÀNH VIÊN</h1>
        <form id="registerForm">
          <label for="hoten">Họ và tên:</label>
          <input type="text" id="hoten" /><br />
          <label for="email">Email:</label>
          <input type="email" id="email" /><br />
          <label for="matkhau">Mật khẩu:</label>
          <input type="password" id="matkhau" /><br />
          <label for="ngaysinh">Ngày sinh:</label>
          <input type="date" id="ngaysinh" /><br />
          <label>Giới tính:</label>
          <div>
            <input type="radio" id="nam" name="gioitinh" />
            <label for="nam">Nam</label>
            <input type="radio" id="nu" name="gioitinh" />
            <label for="nu">Nữ</label>
          </div>
          <button type="submit">ĐĂNG KÝ</button>
          <p id="thongbao"></p>
        </form>
      </section>
    </main>
    <script src="gioithieu.js"></script>
  </body>
</html>
